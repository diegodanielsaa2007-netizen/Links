<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de links</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#2563eb;--bd:#e5e7eb}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#9aa0a6;--bd:#2a2f38}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
  .w{max-width:680px;margin:0 auto}
  h1{font-size:1.3rem} h2{font-size:1.05rem;margin:0 0 10px}
  .c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
  input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
  button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer;margin-top:12px}
  button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);margin:0;padding:6px 10px;font-size:.85rem}
  .r{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
  .r small{color:var(--mu);display:block;word-break:break-all}
  .a{display:flex;gap:6px;flex-shrink:0}
  .m{font-size:.9rem;margin-top:10px;word-break:break-all}
  .e{color:#dc2626}
  img.p{max-width:100%;border-radius:8px;margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
  <h1>Panel de links</h1>

  <div class="c" id="lg">
    <label>Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="in">Entrar</button>
    <div class="m e" id="le"></div>
  </div>

  <div id="app" hidden>
    <div class="c">
      <h2>Nuevo link</h2>
      <label>Código (opcional, si lo dejas vacío se crea uno al azar)</label>
      <input id="code" placeholder="ej: oferta">
      <label>Título de la previsualización</label>
      <input id="title">
      <label>Texto / descripción</label>
      <textarea id="desc" rows="3"></textarea>
      <label>Imagen (sube un archivo)</label>
      <input id="file" type="file" accept="image/*">
      <label>…o pega la URL de una imagen</label>
      <input id="imgurl" placeholder="https://...">
      <img id="prev" class="p" hidden alt="">
      <label>Destino real (tu link original)</label>
      <input id="dest" placeholder="https://www.youtube.com/watch?v=...">
      <button id="mk">Crear link</button>
      <div class="m" id="out"></div>
    </div>

    <div class="c">
      <h2>Mis links</h2>
      <div id="list"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let pw = '';
try { pw = localStorage.getItem('pw') || ''; } catch(e) {}

async function api(method, qs, body){
  const r = await fetch('/api/links' + (qs || ''), {
    method, headers: {'x-admin-password': pw, 'content-type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}

async function load(){
  const links = await api('GET');
  $('lg').hidden = true; $('app').hidden = false;
  $('list').innerHTML = links.length ? links.map(l => `
    <div class="r">
      <div><strong>${esc(l.title)}</strong>
      <small>${esc(location.origin)}/l/${esc(l.code)}</small></div>
      <div class="a">
        <button class="s" data-a="copy" data-c="${esc(l.code)}">Copiar</button>
        <button class="s" data-a="del" data-c="${esc(l.code)}">Borrar</button>
      </div>
    </div>`).join('') : '<p>Aún no hay links.</p>';
}

$('in').onclick = async () => {
  pw = $('pw').value;
  try { await load(); try { localStorage.setItem('pw', pw); } catch(e) {} $('le').textContent = ''; }
  catch(e){ $('le').textContent = e.message; }
};
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('in').click(); });

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const link = location.origin + '/l/' + b.dataset.c;
  if(b.dataset.a === 'copy'){
    try { await navigator.clipboard.writeText(link); b.textContent = '¡Copiado!'; setTimeout(() => b.textContent = 'Copiar', 1200); }
    catch(_) { prompt('Copia el link:', link); }
  } else if(confirm('¿Borrar este link?')){
    try { await api('DELETE', '?code=' + encodeURIComponent(b.dataset.c)); await load(); } catch(err){ alert(err.message); }
  }
});

function shrink(f){
  return new Promise((ok, no) => {
    const i = new Image();
    i.onload = () => {
      const k = Math.min(1, 1200 / i.width), c = document.createElement('canvas');
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', .85));
    };
    i.onerror = () => no(new Error('No se pudo leer la imagen'));
    i.src = URL.createObjectURL(f);
  });
}

function prev(src){ $('prev').hidden = !src; if(src) $('prev').src = src; }
$('file').addEventListener('change', e => { const f = e.target.files[0]; if(f) prev(URL.createObjectURL(f)); });
$('imgurl').addEventListener('input', e => prev(e.target.value.trim()));

$('mk').onclick = async () => {
  const b = $('mk'); b.disabled = true; b.textContent = 'Creando…'; $('out').textContent = '';
  try {
    const body = { code: $('code').value, title: $('title').value, desc: $('desc').value, dest: $('dest').value, image: $('imgurl').value };
    const f = $('file').files[0];
    if(f) body.imageData = await shrink(f);
    const l = await api('POST', '', body);
    const link = location.origin + '/l/' + l.code;
    $('out').innerHTML = '¡Listo! Tu link: <strong>' + esc(link) + '</strong>';
    try { await navigator.clipboard.writeText(link); $('out').innerHTML += ' (copiado)'; } catch(_) {}
    ['code','title','desc','dest','imgurl','file'].forEach(i => $(i).value = ''); prev('');
    await load();
  } catch(e){ $('out').innerHTML = '<span class="e">' + esc(e.message) + '</span>'; }
  b.disabled = false; b.textContent = 'Crear link';
};

if(pw){ $('pw').value = pw; load().catch(() => {}); }
</script>
</body>
</html>
